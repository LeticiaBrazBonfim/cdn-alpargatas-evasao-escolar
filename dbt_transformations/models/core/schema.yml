version: 2

models:
  - name: dim_localidade
    description: |
      Dimensão de Localidade (Município). Snapshot estático (Type 1).
      Fonte: Diretório Territorial Brasileiro (DTB) do IBGE.
      Granularidade: 1 linha por município brasileiro.
    columns:
      - name: sk_localidade
        description: "Surrogate Key (chave substituta) imutável: hash MD5 de id_municipio. Independente de ordenação ou recarga."
        tests:
          - unique
          - not_null

      - name: id_municipio
        description: "Chave natural: código numérico oficial do município (IBGE)."
        tests:
          - unique
          - not_null

      - name: id_nome_municipio
        description: "Descrição composta: id_municipio concatenado com nome (formato: 1234 - São Paulo)."

      - name: nome_municipio
        description: "Nome oficial do município conforme IBGE, em maiúsculas."

      - name: id_uf
        description: "Código numérico da Unidade Federativa (UF)."
        tests:
          - not_null

      - name: id_nome_uf
        description: "Descrição composta: id_uf concatenado com nome da UF."

      - name: nome_uf
        description: "Nome da Unidade Federativa em maiúsculas."

      - name: id_regiao_geografica_imediata
        description: "Código da Região Geográfica Imediata (IBGE)."
        tests:
          - not_null

      - name: id_nome_regiao_geografica_imediata
        description: "Descrição composta: id e nome da Região Geográfica Imediata."

      - name: nome_regiao_geografica_imediata
        description: "Nome da Região Geográfica Imediata em maiúsculas."

  - name: dim_rede
    description: |
      Dimensão de Rede de Ensino (Conformed Dimension). Snapshot estático (Type 1).
      Fonte: stg_ideb (coluna REDE) e stg_taxa_distorcao (coluna NO_DEPENDENCIA) — INEP.
      Granularidade: 1 linha por rede.
      Redes: ESTADUAL (id=2), MUNICIPAL (id=4), FEDERAL (id=6), PRIVADA (id=8), TOTAL (agregado). DESCONHECIDO (fallback p/ chaves órfãs).
    columns:
      - name: sk_rede
        description: "Surrogate Key (chave substituta) imutável: hash MD5 de nome_rede. Usada para JOINs em fatos."
        tests:
          - unique
          - not_null

      - name: id_rede
        description: "Chave Natural: código arbitrário da rede (2=ESTADUAL, 4=MUNICIPAL, 6=FEDERAL, 8=PRIVADA). NULL para TOTAL e DESCONHECIDO."
        tests:
          - unique

      - name: id_nome_rede
        description: "Descrição composta: id_rede + ' - ' + rede. Redes sem id (TOTAL, DESCONHECIDO) exibem apenas o nome."

      - name: nome_rede
        description: "Nome amigável da rede de ensino em maiúsculas. Valores: ESTADUAL, MUNICIPAL, FEDERAL, PRIVADA, TOTAL, DESCONHECIDO."

  - name: fato_projetos_ia
    description: |
      Fato: Projetos de Inteligência Artificial Educacional da Alpargatas.
      Granularidade: 1 linha por município + ano.
      Métricas: quantidade de projetos e beneficiários por município/ano.
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: ano
        description: "Ano de execução do projeto (ano_competencia)."
        tests:
          - not_null

      - name: quantidade_projetos
        description: "Total de projetos de IA executados no município naquele ano."
        tests:
          - not_null

      - name: quantidade_beneficiados
        description: "Soma total de alunos ou instituições beneficiadas pelos projetos."
        tests:
          - not_null

  - name: fato_socioeconomica
    description: |
      Fato: Indicadores Socioeconômicos Municipais.
      Fonte: Produto Interno Bruto (PIB) e Valor Adicionado Bruto (VA) - IBGE.
      Granularidade: 1 linha por município + ano.

      IMPORTANTE: Cálculos de referência IBGE:
      - Valor Adicionado Bruto (VAB) = soma dos valores adicionados por setor
      - PIB = VAB Total + Impostos líquidos sobre produtos
      - PIB per capita: NÃO DISPONÍVEL (não há dados de população na fonte primária)
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: ano
        description: "Ano de referência da métrica."
        tests:
          - not_null

      - name: va_bruto_agropecuaria
        description: |
          Valor Adicionado Bruto do setor Agropecuário.
          Unidade: R$ 1.000 (milhares de reais).
          Preços: correntes (sem deflacionamento).

      - name: va_bruto_industria
        description: |
          Valor Adicionado Bruto do setor Industrial.
          Unidade: R$ 1.000 (milhares de reais).
          Preços: correntes.

      - name: va_bruto_servicos
        description: |
          Valor Adicionado Bruto do setor de Serviços.
          EXCLUÍDOS: Administração pública, defesa, educação e saúde públicas, seguridade social.
          Unidade: R$ 1.000.
          Preços: correntes.

      - name: va_bruto_administracao_publica
        description: |
          Valor Adicionado Bruto da Administração Pública, defesa, educação e saúde públicas, seguridade social.
          Unidade: R$ 1.000.
          Preços: correntes.

      - name: va_bruto_total
        description: |
          Soma dos Valores Adicionados Brutos de todos os setores.
          Unidade: R$ 1.000.
          Preços: correntes.

      - name: impostos_liquidos
        description: |
          Impostos líquidos de subsídios sobre produtos.
          Diferença entre PIB e VAB Total.
          Unidade: R$ 1.000.
          Preços: correntes.

      - name: pib_total
        description: |
          Produto Interno Bruto Total = VAB Total + Impostos líquidos.
          Unidade: R$ 1.000.
          Preços: correntes.

      - name: pib_per_capita
        description: |
          Produto Interno Bruto per capita.
          Unidade: R$ 1,00 (reais por habitante).
          Preços: correntes.
          Calculado pelo IBGE com base na população do Censo/estimativas.

  - name: fato_taxa_distorcao_municipio
    description: |
      Fato: Taxa de Distorção Idade-Série — Agregado Municipal (Grão Macro).
      Fonte: INEP (Censo Escolar). Apenas linhas com categoria=TOTAL e dependencia=TOTAL.
      Granularidade: 1 linha por município + ano.

      Taxa de Distorção: percentual de alunos com idade superior à recomendada para a série.
      Valores esperados: entre 0 e 100 (percentual).
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: ano
        description: "Ano do Censo Escolar."
        tests:
          - not_null

      - name: taxa_distorcao_ensino_fundamental
        description: |
          Taxa de distorção idade-série no Ensino Fundamental.
          Unidade: percentual (0-100).

      - name: taxa_distorcao_ensino_medio
        description: |
          Taxa de distorção idade-série no Ensino Médio.
          Unidade: percentual (0-100).

  - name: fato_taxa_distorcao_rede_categoria
    description: |
      Fato: Taxa de Distorção Idade-Série — por Rede e Categoria (Grão Micro).
      Fonte: INEP (Censo Escolar). Exclui o agregado municipal puro (categoria=TOTAL e dependencia=TOTAL).
      Granularidade: 1 linha por município + ano + categoria_localidade + rede (sk_rede).
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_rede
        description: "Foreign Key para dim_rede (Conformed Dimension). Chave substituta MD5 do nome da rede de ensino."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rede')
                field: sk_rede

      - name: ano
        description: "Ano do Censo Escolar."
        tests:
          - not_null

      - name: categoria_localidade
        description: "Categoria da localidade: Urbana, Rural ou TOTAL (quando rede é específica)."

      - name: taxa_distorcao_ensino_fundamental
        description: |
          Taxa de distorção idade-série no Ensino Fundamental.
          Unidade: percentual (0-100).

      - name: taxa_distorcao_ensino_medio
        description: |
          Taxa de distorção idade-série no Ensino Médio.
          Unidade: percentual (0-100).

  - name: fato_ideb
    description: |
      Fato: Índice de Desenvolvimento da Educação Básica (IDEB).
      Fonte: Instituto Nacional de Estudos e Pesquisas Educacionais (INEP).
      Granularidade: 1 linha por município + ano + rede (ESTADUAL, MUNICIPAL, FEDERAL).
      Período: Bienal 2005-2023. PÚBLICA removida (é agregado de Estadual + Municipal).

      O IDEB sintetiza aprovação escolar e desempenho nas avaliações (SAEB).
      Fórmula: IDEB = Nota SAEB × Taxa de Aprovação.
      Valores esperados: índice 0-10.
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_rede
        description: "Foreign Key para dim_rede."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rede')
                field: sk_rede

      - name: ano
        description: "Ano de referência do IDEB (bienal: 2005, 2007, ..., 2023)."
        tests:
          - not_null

      - name: ideb_observado
        description: |
          IDEB Observado (índice 0-10) - métrica principal calculada pelo INEP.
          Unidade: índice (0-10).
          Valores nulos indicam ausência de dados.

      - name: ideb_projecao
        description: |
          IDEB Projeção/Meta (índice 0-10) - meta estabelecida para o ciclo.
          Unidade: índice (0-10).

      - name: nota_media_saeb
        description: |
          Nota média SAEB (Matemática + Português / 2) - componente do IDEB.
          Unidade: pontos SAEB (2 casas decimais).

      - name: nota_matematica_saeb
        description: |
          Nota SAEB em Matemática - componente do IDEB.
          Unidade: pontos SAEB (2 casas decimais).

      - name: nota_portugues_saeb
        description: |
          Nota SAEB em Português - componente do IDEB.
          Unidade: pontos SAEB (2 casas decimais).

      - name: taxa_aprovacao_series_iniciais
        description: |
          Taxa de aprovação nas Séries Iniciais (1º ao 5º ano) - componente do IDEB.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: taxa_aprovacao_si_4ano
        description: |
          Taxa de aprovação no 4º ano das Séries Iniciais.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: taxa_aprovacao_1ano
        description: |
          Taxa de aprovação no 1º ano.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: taxa_aprovacao_2ano
        description: |
          Taxa de aprovação no 2º ano.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: taxa_aprovacao_3ano
        description: |
          Taxa de aprovação no 3º ano.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: taxa_aprovacao_4ano
        description: |
          Taxa de aprovação no 4º ano.
          Unidade: decimal (0-1). No Metabase, configurar como percentual.

      - name: indicador_rendimento
        description: |
          Indicador de Rendimento (fluxo escolar) - componente do IDEB.
          Unidade: decimal (0-1).
