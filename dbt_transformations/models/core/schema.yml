version: 2

models:
  - name: dim_localidade
    description: |
      Dimensão de Localidade (Município).
      Fonte: Diretório Territorial Brasileiro (DTB) do IBGE.
      Granularidade: 1 linha por município brasileiro.
    columns:
      - name: sk_localidade
        description: "Surrogate Key determinística, hash MD5 do código IBGE do município (id_municipio). Estável entre execuções."
        tests:
          - unique
          - not_null

      - name: id_municipio
        description: "Chave natural: código numérico oficial do município (IBGE)."
        tests:
          - unique
          - not_null

      - name: id_nome_municipio
        description: "Descrição composta: id_municipio concatenado com nome (formato: 1234 - São Paulo)."

      - name: nome_municipio
        description: "Nome oficial do município conforme IBGE, em maiúsculas."

      - name: id_uf
        description: "Código numérico da Unidade Federativa (UF)."
        tests:
          - not_null

      - name: sigla_uf
        description: "Sigla da Unidade Federativa (ex: PB, PE, SP). Derivada do código numérico oficial do IBGE."
        tests:
          - not_null

      - name: id_nome_uf
        description: "Descrição composta: id_uf concatenado com nome da UF."

      - name: nome_uf
        description: "Nome da Unidade Federativa em maiúsculas."

      - name: id_regiao_geografica_imediata
        description: "Código da Região Geográfica Imediata (IBGE)."

      - name: id_nome_regiao_geografica_imediata
        description: "Descrição composta: id e nome da Região Geográfica Imediata."

      - name: nome_regiao_geografica_imediata
        description: "Nome da Região Geográfica Imediata em maiúsculas."

  - name: dim_calendario
    description: |
      Dimensão Temporal.
      Gera anos de 2000 a 2031 para suporte a séries históricas.
      Granularidade: 1 linha por ano.
    columns:
      - name: sk_calendario
        description: "Surrogate Key determinística, hash MD5 do ano."
        tests:
          - unique
          - not_null

      - name: ano_referencia
        description: "Ano de referência (2000-2031)."
        tests:
          - unique
          - not_null

  - name: dim_rede
    description: |
      Dimensão de Rede de Ensino.
      Fontes: ideb_municipios (coluna REDE) e stg_taxa_distorcao (dependencia_administrativa).
      Granularidade: 1 linha por tipo de rede.
    columns:
      - name: sk_rede
        description: "Surrogate Key determinística, hash MD5 do nome_rede."
        tests:
          - unique
          - not_null

      - name: nome_rede
        description: "Nome padronizado da rede: FEDERAL, ESTADUAL, MUNICIPAL, PRIVADA, PÚBLICA ou DESCONHECIDO."
        tests:
          - unique
          - not_null

      - name: id_rede
        description: "Código numérico da rede (0=Pública, 2=Estadual, 4=Municipal, 6=Federal, 8=Privada, -1=Desconhecido)."
        tests:
          - unique
          - not_null

      - name: id_nome_rede
        description: "Descrição composta: id_rede concatenado com nome_rede."
        tests:
          - unique
          - not_null

  - name: fato_projetos_ia
    description: |
      Fato: Projetos de Inteligência Artificial Educacional da Alpargatas.
      Granularidade: 1 linha por município + ano.
      Métricas: quantidade de projetos e beneficiários por município/ano.
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_calendario
        description: "Foreign Key para dim_calendario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: sk_calendario

      - name: ano
        description: "Ano de execução do projeto (ano_competencia)."
        tests:
          - not_null

      - name: quantidade_projetos
        description: "Total de projetos de IA executados no município naquele ano."
        tests:
          - not_null

      - name: quantidade_beneficiados
        description: "Soma total de alunos ou instituições beneficiadas pelos projetos."
        tests:
          - not_null

  - name: fato_pib_municipios
    description: |
      Fato: Indicadores Socioeconômicos Municipais.
      Fonte: Produto Interno Bruto (PIB) e Valor Adicionado Bruto (VA) - IBGE.
      Granularidade: 1 linha por município + ano.

      Cálculos de referência IBGE:
      - Valor Adicionado Bruto (VAB) = soma dos valores adicionados por setor
      - PIB = VAB Total + Impostos líquidos sobre produtos
      - PIB per capita: NÃO DISPONÍVEL (não há dados de população na fonte primária)
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_calendario
        description: "Foreign Key para dim_calendario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: sk_calendario

      - name: pib_agropecuaria
        description: |
          Valor Adicionado Bruto do setor Agropecuário.
          Unidade: R$ 1.000 (milhares de reais). Preços: correntes.

      - name: pib_industria
        description: |
          Valor Adicionado Bruto do setor Industrial.
          Unidade: R$ 1.000 (milhares de reais). Preços: correntes.

      - name: pib_servicos
        description: |
          Valor Adicionado Bruto do setor de Serviços.
          EXCLUÍDOS: Administração pública, defesa, educação e saúde públicas, seguridade social.
          Unidade: R$ 1.000. Preços: correntes.

      - name: pib_administracao_publica
        description: |
          Valor Adicionado Bruto da Administração Pública, defesa, educação e saúde públicas, seguridade social.
          Unidade: R$ 1.000. Preços: correntes.

      - name: pib_vab_total
        description: |
          Soma dos Valores Adicionados Brutos de todos os setores.
          Unidade: R$ 1.000. Preços: correntes.

      - name: pib_impostos
        description: |
          Impostos líquidos de subsídios sobre produtos.
          Diferença entre PIB e VAB Total. Unidade: R$ 1.000. Preços: correntes.

      - name: pib_total
        description: |
          Produto Interno Bruto Total = VAB Total + Impostos líquidos.
          Unidade: R$ 1.000. Preços: correntes.

      - name: pib_per_capita
        description: |
          Produto Interno Bruto per capita.
          Unidade: R$ 1,00. Preços: correntes.

  - name: fato_ideb_municipios
    description: |
      Fato: Índice de Desenvolvimento da Educação Básica (IDEB) por Município.
      Fonte: INEP - IDEB Municipal.
      Granularidade: 1 linha por município + rede + ano.
      Colunas desagregadas por ano (2005-2023) via UNPIVOT.
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_rede
        description: "Foreign Key para dim_rede."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rede')
                field: sk_rede

      - name: sk_calendario
        description: "Foreign Key para dim_calendario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: sk_calendario

      - name: ideb_observado
        description: "IDEB observado no ano de referência."

      - name: ideb_projecao
        description: "IDEB projetado (disponível apenas 2007-2021)."

      - name: nota_media_saeb
        description: "Nota média SAEB (escala do exame)."

      - name: nota_matematica_saeb
        description: "Nota de matemática SAEB."

      - name: nota_portugues_saeb
        description: "Nota de português SAEB."

      - name: taxa_aprovacao_series_iniciais
        description: "Taxa de aprovação séries iniciais (1º ao 5º ano)."

      - name: taxa_aprovacao_si_4ano
        description: "Taxa de aprovação 4º ano."

      - name: taxa_aprovacao_1ano
        description: "Taxa de aprovação 1º ano."

      - name: taxa_aprovacao_2ano
        description: "Taxa de aprovação 2º ano."

      - name: taxa_aprovacao_3ano
        description: "Taxa de aprovação 3º ano."

      - name: taxa_aprovacao_4ano
        description: "Taxa de aprovação 4º ano (séries iniciais)."

      - name: indicador_rendimento
        description: "Indicador de rendimento escolar."

  - name: fato_taxa_distorcao_municipio
    description: |
      Fato: Taxa de Distorção Idade-Série (consolidado por município).
      Fonte: INEP - Censo Escolar.
      Granularidade: 1 linha por município + ano (categoria=TOTAL, dependência=TOTAL).
      Taxa de Distorção: percentual de alunos com idade superior à recomendada para a série.
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_calendario
        description: "Foreign Key para dim_calendario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: sk_calendario

      - name: taxa_distorcao_ensino_fundamental
        description: |
          Taxa de distorção idade-série no Ensino Fundamental.
          Unidade: percentual (0-100). Valores nulos indicam ausência de dados.

      - name: taxa_distorcao_ensino_medio
        description: |
          Taxa de distorção idade-série no Ensino Médio.
          Unidade: percentual (0-100). Valores nulos indicam ausência de dados.

  - name: fato_taxa_distorcao_rede_categoria
    description: |
      Fato: Taxa de Distorção Idade-Série desagregada por rede e categoria.
      Fonte: INEP - Censo Escolar.
      Granularidade: 1 linha por município + rede + categoria + ano.
      Exclui registros consolidados (TOTAL/TOTAL).
    columns:
      - name: sk_localidade
        description: "Foreign Key para dim_localidade."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: sk_localidade

      - name: sk_rede
        description: "Foreign Key para dim_rede."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rede')
                field: sk_rede

      - name: sk_calendario
        description: "Foreign Key para dim_calendario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: sk_calendario

      - name: categoria_localidade
        description: "Categoria da localidade: Urbana ou Rural."

      - name: taxa_distorcao_ensino_fundamental
        description: |
          Taxa de distorção idade-série no Ensino Fundamental.
          Unidade: percentual (0-100).

      - name: taxa_distorcao_ensino_medio
        description: |
          Taxa de distorção idade-série no Ensino Médio.
          Unidade: percentual (0-100).
