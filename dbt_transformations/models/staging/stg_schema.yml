version: 2

models:
  - name: dtb_municipios
    description: "Diretório Territorial Brasileiro (IBGE). Fonte da verdade para os códigos numéricos de municípios e estados."
    columns:
      - name: id_municipio
        description: "Código numérico oficial do município (Chave Primária Natural)."
        tests:
          - unique
          - not_null

  - name: pib_municipios
    description: "Indicadores socioeconômicos municipais (PIB/VAB - IBGE) — staging com casting direto."
    columns:
      - name: id_municipio
        description: "Código numérico oficial do município."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dtb_municipios')
                field: id_municipio
      - name: ano
        description: "Ano de referência do PIB."
        tests:
          - not_null
      - name: pib_per_capita
        description: "Produto Interno Bruto per capita (R$ 1,00)."

  - name: taxa_distorcao
    description: "Taxa de distorção idade-série (INEP) — staging unificada. Contém todos os grãos (municipio e rede/categoria). O filtro por grão é feito nos fatos core."
    columns:
      - name: id_municipio
        description: "Código numérico oficial do município."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dtb_municipios')
                field: id_municipio
      - name: ano_competencia
        description: "Ano do Censo Escolar."
        tests:
          - not_null
      - name: categoria_localidade
        description: "Categoria da localidade: Urbana, Rural ou TOTAL."
        tests:
          - not_null
      - name: dependencia_administrativa
        description: "Dependência administrativa: Federal, Estadual, Municipal, Privada ou TOTAL."
        tests:
          - not_null
      - name: taxa_distorcao_ensino_fundamental
        description: "Taxa de distorção idade-série — Ensino Fundamental (decimal 0-1)."
      - name: taxa_distorcao_ensino_medio
        description: "Taxa de distorção idade-série — Ensino Médio (decimal 0-1)."

  - name: projetos_ia
    description: "Projetos de IA educacional Alpargatas — staging 1:1. Filtra linhas com soma de projetos = 0."
    columns:
      - name: id_municipio
        description: "Código numérico oficial do município (IBGE 7 dígitos). Enriquecido via DTB no pré-processamento."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dtb_municipios')
                field: id_municipio
      - name: ano_competencia
        description: "Ano de execução do projeto."
        tests:
          - not_null
      - name: sigla_uf
        description: "Sigla da Unidade Federativa (ex: SP, RJ)."
      - name: nome_municipio
        description: "Nome do município em maiúsculas."

  - name: ideb_municipios
    description: "Índice de Desenvolvimento da Educação Básica (INEP) — staging wide format 1:1. O UNPIVOT para formato longo é realizado na camada core (fato_ideb_municipios)."
    columns:
      - name: id_municipio
        description: "Código numérico oficial do município."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dtb_municipios')
                field: id_municipio
      - name: nome_municipio
        description: "Nome do município em maiúsculas."
      - name: sigla_uf
        description: "Sigla da Unidade Federativa."
      - name: nome_rede
        description: "Rede de ensino: ESTADUAL, MUNICIPAL ou FEDERAL."
